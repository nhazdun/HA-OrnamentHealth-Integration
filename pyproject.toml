[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
