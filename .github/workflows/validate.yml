name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: only integrations shipped with Home Assistant have assets in
          # home-assistant/brands. description and topics are GitHub repository
          # settings; fill them in and drop them from this list before submitting
          # the repository to the HACS default store.
          ignore: brands description topics

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - name: Run tests
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log
      - name: Publish results
        if: always()
        run: |
          {
            echo '```'
            tail -150 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff
